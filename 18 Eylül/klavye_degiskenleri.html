<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobil Klavye Değişkenleri</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f8fafc;
            color: #0f172a;
            line-height: 1.5;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 13px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;

        }
        input:focus {
            border-color: #3b82f6;
            outline: none;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
        }
        .hint {
            font-size: 11px;
            color: #64748b;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <h3>Mobil Sanal Klavye Girişleri</h3>
    <form id="mobileForm" autocomplete="on">
        <div class="form-group">
            <label for="txtName">Ad Soyad (Otomatik Büyük Harf)</label>
            <input type="text" id="txtName" name="full_name"
            placeholder="Selehaddin ÇİFTÇİ" autocomplete="name"
            autocapitalize="words" enterkeyhint="next">
            <div class="hint">authocapatalize="words" her kelimenin ilk
             harfini büyük yapar</div> 
        </div>
        <div class="form-group">
            <label for="txtEmail">Eposta (düzeltme kapalı)</label>
            <input type="email" id="txtEmail" name="email"
            placeholder="selehaddin@kodvance.com" authocomplete="email"
            autocapitalize="none" enterkeyhint="next">
            <div class="hint">@ ve .com tuşları eklenir</div>
        </div>
        <div class="form-group">
            <label for="txtCard">Kredi kartı numarası(sayısal tuş takımı)</label>
            <input type="text" id="txtCard" name="card_number"
            placeholder="1234 5678 9012 3456"
               autocomplete="cc-number" inputmode="numeric" maxlength="19"
               enterkeyhint="next">
            <div class="hint">inputmode="numeric sayısal tuş takımı açar ok tuşları çıkmaz</div>
        </div>
        <div class="form-group">
            <label for="txtAmount">Para transferi tutarı</label>
            <input type="text" id="txtAmount" name="amount" placeholder="1.250,50" 
            inputmode="decimal" enterkeyhint="next">
            <div class="hint">Mobilde virgüllü noktalı ondalık sayı klayesini açar</div>
        </div>
        <div class="form-group">
            <label for="txt0tp">Sms DoĞrulama Kodu</label>
            <input type="text" id="txt0tp" placeholder="123456"
            inputmode="numeric" maxlength="6"
               autocomplete="one-time-code" enterkeyhint="done">
            <div class="hint">Sms geldiğinde klavyede kodu doldur onerisi  çıkarır</div>
        </div>
    </form>
    
</body>
</html>
