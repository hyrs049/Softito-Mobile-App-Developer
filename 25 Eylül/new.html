<!DOCTYPE html>
<!--Bu satır tarayıcıya "Bu belge HTML5 standardına göre yazıldı" der; 
tarayıcı buna bakarak sayfayı doğru kurallarla yorumlar-->
<html lang="en">
<!-- <html>: tüm sayfanın en dış kapsayıcısı; lang="en" tarayıcıya ve ekrana 
okuyuculara sayfanın dilini bildirir-->
<head>
    <!-- <head>: ekranda GÖRÜNMEYEN, tarayıcıya/arama motorlarına bilgi veren
kısım: başlık,karakter kodlaması, meta bilgiler, CSS-->
    <meta charset="UTF-8">
    <!-- Sayfanın hangi karakter kümesiyle okunacağını belirtir; UTF-8 olmazsa 
Türkçe karakterler (ş,ğ,ı,ö,ü,ç) bozuk görünür-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Mobil cihazlarda sayfanın cihaz genişliğine göre ölçeklenmesini sağlar
; bu olmazsa telefonda sayfa küçük/yakınlaştırılmış görünür -->
    <title>Sipariş & Gelir Kokpit Dashboard</title>
    <!--Tarayıcı sekmesinde (tab) görünen başlık; sayfa içeriğiyle ilgisi yoktur-->
    <style>
        :root {
            /*Bu blokta sitede tekrar tekrar kullanacağımız renkleri/fontları
    "değişken" (custom property) olarak tanımlıyoruz.
    Aşağıda var(--isim) yazarak bu değerleri çağıracağız; böylece örneğin
    ana rengi değiştirmek istediğimizdetek bir satırı değiştirmemiz yeterli olur,
    kodun her yerini tek tek aramıza grek kalmaz. */

            --bg: #f8f7f4; /* Sayfanın genel arka plan rengi(kırık beyaz/krem)*/
            --card: #ffffff; /*Kart/panel gibi kutuların arka plan rengi (saf beyaz)*/
            --border: #e6e5df;/*Kutuların ince kenarlık rengi(açık gri)*/
            --text: #181716; /*Ana yazı rengi(nerdeyse siyah)*/
            --muted: #6b6963;/*Daha az önemli/ikincil yazılar için soluk gri*/
            --clay: #c85a32;/*Vurgu(accent* rengi-turuncu/kiremit tonu; butonlar ve etiketlerde kullanılır*/
            --clay-hover: #b04e29;/*Fare üzerine gelince(hover)--clay renginin koyulaşmış hali*/
            --font-main: 'Plus Jakarta Sans', system-ui, sans-serif;/*Ana yazı tipi; bu font yüklenmezse sırasıyla sistem fontuna ,o da olmazsa herhangi bir sans-serif fonta düşer*/
            --font-mono: 'JetBrains Mono', monospace;/*Sayılar için kullanılan eşit-genişlikli "daktilo tarzı" font(rakamlar hizalı görünsün diye)*/
        }

        * {
            /*Yıldız(*) "sayfadaki HER eleman" demek.Tarayıcılar her etikete kendi varsayılan boşluğunu ekler
            (h1 ile p arasındaki boşluk farklıdır mesela); bu 3 satır o varsayılanları sıfırlayıp temiz bir
            başlangıç noktası verir,tasarımı tamamen biz kontrol ederiz.*/
            box-sizing: border-box;
            /*Bir elemanın genişliği hesaplanırken padding ve border,genişliğe
            EKLENMEK yerine genişliğin İÇİNDEN sayılır
            (yoksa padding eklediğinde kutular beklenenden büyür)*/
            margin: 0;/*Tüm elemanların varsayılan dış boşluğunu sıfırlar*/
            padding: 0;/*tüm elemanların varsayılan iç boşluğunu sıfırlar*/
        }

        body {
            /*Sayfanın en dş görünür kapsayıcısının genel görünümünü belirler*/
            background: var(--bg);/* Arka planı krem rengine boyar*/
            color: var(--text);/*Varsayılan yazı rengini koyu tna ayarlar*/
            font-family: var(--font-main);/*Tüm sayfada ana fontu kullan*/
            padding: 36px 16px;/*Kenarlardan ieriğe boşluk bırakır(üst-alt 36pixel,sağ-sol 16 pixel)
            içerik ekranın kenarına yapışmasın diye*/
            line-height: 1.5;/*Satır aralığını yazı boyutunun 1.5 katı yapar,metin daha rahat okunur*/
        }

        .kokpit {
            /*Tüm görünür içeriği saran ana kapsayıcının genişiliğini sınırlar*/
            max-width: 960px;/*İçerik en fazla 960 px genişilikte olsun: geniş ekranlarda aşırı yayılıp okunaksız olmasın*/
            margin: 0 auto;/*Üst- alt boşluk 0,sağ-sol"auto" ->içeriği ekranda yatayda ortalar*/
        }

        /* Header & KPI */
        .header {
            /*Sayfanın en üstündeki başlık bölümünün görünümünü */
            margin-bottom: 24px;/*Başlıkta altındaki içerik arasına boşluk bırakır*/
            padding-bottom: 16px;/*Alttaki çizgiden önce iç boşluk bırakır*/
            border-bottom: 1px solid var(--border);/*Başlığın altına ince ayırıcı çizgi çizer*/
        }

        .header__tag {
            /*Başlığın üstündeki küçük etiket yazısı("Sipariş Tkip*/
            font-size: 11px;/*Küçük punto*/
            text-transform: uppercase;/*yazıyı ekranda her zaman BÜYÜK HARF gösterir*/
            letter-spacing: 0.12em;/*Harfler arasına boşluk koyar,"etiet /rozet" hissi verir*/
            color: var(--clay);/*Vurgu rengiyle boyar*/
            font-weight: 700;/*kalın Yazı*/
        }

        .header__title {
            /*Sayfanın büyük ana başlığı("Sipariş Yönetim Kokpiti")*/
            font-size: 26px;/*Büyük Punto*/
            font-weight: 700;/*Kalın Yazı*/
            margin-top: 2px;/*Üstteki küçükk etiketle arasında ufak Boşluk*/
        }

        .kpi-grid {
            /*Ekranın üst kısmındaki 3 özet kutusunu(KPIkartlarını)saran bölümün düzeni */
            display: grid;/*Bu kapsayıcı bir "grid" (ızgara)düzenine çevirir*/
            grid-template-columns: repeat(3, 1fr);/*Izgarayı 3 eşit sütuna böler-> ekrand 3 kutu yan yana durur*/
            gap: 14px;/*Kutular arasına boşluk koyar*/
            margin-bottom: 24px;/*KPI bölümüyle altındaki form/liste bölümü arasına boşlul bırakır*/
        }

        .kpi-card {
            /*Tek bir KPI kutusunun (örn."Kayıtlı sipariş")görünümü*/
            background: var(--card);/*Beyaz arka plan*/
            border: 1px solid var(--border);/* İnce kenarlık */
            border-radius: 8px; /* Yuvarlak köşeler */
            padding: 14px 18px;/* İçerikle kenar arasına boşluk */
        }

        .kpi-card span {
             /* Kartın üstündeki küçük başlık yazısı */
            font-size: 12px; /* Küçük punto */
            color: var(--muted);/* Soluk gri, ana rakamdan az dikkat çeksin */
            font-weight: 600;/* Orta-kalın yazı */
        }

        .kpi-card h3 {
              /* Kartın asıl rakamı (örn. "5" ya da "38.500 ₺") */
            font-size: 22px;/* Büyük, dikkat çekici punto */
            font-weight: 700;/* Kalın yazı */
            font-family: var(--font-mono);/* Rakamlar eşit-genişlikli fontla daha okunaklı hizalanır */
            margin-top: 4px;/* Üstteki etiketle arasında ufak boşluk */
        }

        /* Layout */
        .layout {
            /* Form (sol) ve liste (sağ) bölümlerini yan yana tutan ana içerik alanının düzeni */
            display: grid; /* Grid düzeni kullanır */
            grid-template-columns: 320px 1fr; /* Sol sütun sabit 320px, sağ sütun kalan tüm alanı kaplar */
            gap: 24px; /* İki sütun arasına boşluk koyar */
        }

        @media (max-width: 768px) {
 /* Bu blok SADECE ekran genişliği 768px veya daha darsa (telefon/küçük tablet) devreye girer -
               "responsive" (duyarlı) tasarımın kalbi burasıdır */
            .layout,
            .kpi-grid {
                grid-template-columns: 1fr;
                  /* Hem KPI kutularını hem de form+liste düzenini tek sütuna indirir ->
                   geniş ekranda yan yana duran şeyler dar ekranda alt alta dizilir */
            }
        }

        /* Form & Panel */
        .panel {
             /* Form ve liste bölümlerinin ortak "kart" görünümü */
            background: var(--card);/* Beyaz arka plan */
            border: 1px solid var(--border);/* İnce kenarlık */
            border-radius: 10px;/* Yuvarlak köşeler */
            padding: 20px;/* İçerikle kenar arasına boşluk */
        }

        .panel h4 {
            /* Panelin küçük başlığı (örn. "Yeni sipariş kaydı") */
            font-size: 15px;
            /* Orta punto */
            font-weight: 700;
             /* Kalın yazı */
            margin-bottom: 14px;
             /* Başlıkla altındaki içerik arasına boşluk */
            padding-bottom: 8px; /* Alttaki çizgiden önce boşluk */
            border-bottom: 1px solid var(--border);/* Panel başlığının altına ince ayırıcı çizgi */
        }

        .field {
             /* Formdaki her bir alanı (etiket + kutu ikilisi) saran kapsayıcı */
            margin-bottom: 12px;/* Alanlar arasına dikey boşluk koyar */
        }

        .field label {
             /* Her input'un üstündeki etiket yazısı */
            display: block;/* Etiketi kendi satırına yerleştirir (input'un yanında değil üstünde görünür) */
            font-size: 12px; /* Küçük punto */
            font-weight: 600;/* Orta-kalın yazı */
            margin-bottom: 4px; /* Etiketle altındaki kutu arasına ufak boşluk */
        }

        .field input,
        .field select {
             /* Form içindeki metin kutusu ve açılır listelerin ortak görünümü */
            width: 100%;/* Kutuyu kapsayıcısının tüm genişliğine yayar */
            padding: 8px 10px; /* İçindeki metinle kenar arasına boşluk bırakır, tıklaması/okunması kolaylaşır */
            font-size: 13px;/* Kutu içi yazı boyutu */
            font-family: inherit;/* Sayfanın genel fontunu kullan (tarayıcı varsayılanını değil) */
            background: var(--bg);/* Hafif krem arka plan, boş olduğu belli olsun */
            border: 1px solid var(--border);/* İnce kenarlık */
            border-radius: 6px; /* Hafif yuvarlak köşeler */
        }

        .field input:focus,
        .field select:focus {
            /* Kullanıcı bu kutuya tıklayıp odaklanınca (focus) görünümü */
            outline: none;
            /* Tarayıcının varsayılan (genelde çirkin mavi) odak çerçevesini kaldırır */
            border-color: var(--clay);
            /* Kenarlığı vurgu rengine boyar, "buraya yazıyorum" hissi verir */
            background: #fff;
            /* Arka planı saf beyaza çevirir, biraz daha "aktif" görünür */
        }

        .btn-submit {
            /* "Siparişi Kaydet" butonunun görünümü */
            width: 100%;
            /* Butonu panelin tüm genişliğine yayar */
            background: var(--clay);
            /* Vurgu rengiyle boyar */
            color: #fff;
            /* Beyaz yazı */
            border: none;
            /* Kenarlık yok, düz görünüm */
            padding: 10px;
            /* İçine boşluk, tıklama alanı büyüsün */
            font-size: 13px;
            /* Yazı boyutu */
            font-weight: 600;
            /* Orta-kalın yazı */
            border-radius: 6px;
            /* Yuvarlak köşeler */
            cursor: pointer;
            /* Fare üzerine gelince "el" işaretine döner, tıklanabilir olduğunu belli eder */
            margin-top: 6px;
            /* Üstteki son form alanıyla arasına boşluk */
        }

        .btn-submit:hover {
             /* Fare butonun üzerindeyken görünüm */
            background: var(--clay-hover);
            /* Rengi biraz koyulaştırır - kullanıcıya görsel geri bildirim verir */
        }

        /* Liste & Filtre */
        .filter-bar {
          /* Arama kutusu ve kategori seçimini yan yana tutan satır */
            display: flex;
            /* İçindekileri yatayda (satır halinde) dizer */
            gap: 10px;
            /* Aralarına boşluk koyar */
            margin-bottom: 14px;
            /* Filtre satırıyla altındaki liste arasına boşluk */
        }

        .order-list {
            /* Sipariş kartlarının dizildiği kapsayıcı */
            display: flex;
            /* Flex düzeni kullanır */
            flex-direction: column;
            /* Kartları yan yana değil ALT ALTA sıralar */
            gap: 10px;
            /* Kartlar arasına boşluk koyar */
        }

        .order-item {
             /* Tek bir sipariş satırının (kartın) görünümü */
            background: var(--bg);
            /* Hafif krem arka plan (panelin beyazından ayrışsın diye) */
            border: 1px solid var(--border);
            /* İnce kenarlık */
            border-radius: 6px;
            /* Yuvarlak köşeler */
            padding: 12px 14px;
            /* İçerikle kenar arasına boşluk */
            display: flex;
            /* İçindeki (ürün bilgisi | rozet+buton) kısımlarını yan yana dizer */
            justify-content: space-between;
            /* Sol taraf ile sağ taraf arasındaki boşluğu maksimuma çıkarır -> biri solda biri sağda durur */
            align-items: center;
            /* İçindekileri dikeyde ortalar */
        }

        .order-item h5 {
           /* Ürün adı yazısı */
            font-size: 13px;
            /* Yazı boyutu */
            font-weight: 600;
            /* Orta-kalın yazı */
        }

        .order-item p {
            /* Fiyat satırı */
            font-size: 12px;
            /* Ad yazısından daha küçük punto */
            color: var(--muted);
            /* Soluk gri, ikincil bilgi olduğu belli olsun */
        }

        .meta-box {
            /* Kategori rozetiyle "Sil" butonunu bir arada tutan kapsayıcı */
            display: flex;
            /* İçindekileri yan yana dizer */
            align-items: center;
            /* Dikeyde ortalar, ikisi aynı hizada dursun */
            gap: 10px;
            /* Aralarına boşluk koyar */
        }

        .badge {
            /* Kategori rozetinin ortak (temel) görünümü */
            font-size: 11px;
            /* Küçük punto */
            padding: 2px 7px;
            /* İçine az miktarda boşluk */
            border-radius: 4px;
            /* Hafif yuvarlak köşeler */
            font-weight: 600;
            /* Orta-kalın yazı */
            background: #fef3c7;
            /* Varsayılan (hiçbir --mobilya/--aydinlatma/--seramik class'ı eklenmezse görünecek) sarımsı zemin */
            color: #92400e;
            /* Koyu kahve-turuncu yazı */
            font-family: var(--font-mono);
            /* Eşit genişlikli font, "etiket" hissi versin */
        }

        .badge--mobilya {
            /* Kategori "Mobilya" olduğunda .badge üstüne eklenen ek renk */
            background: #e0e7ff;
            /* Açık lila/mavi zemin */
            color: #3730a3;
            /* Koyu mor-mavi yazı */
        }

        .badge--aydinlatma {
            /* Kategori "Aydınlatma" olduğunda eklenen renk */
            background: #fef3c7;
            /* Açık sarı zemin */
            color: #b45309;
            /* Koyu turuncu-kahve yazı */
        }

        .badge--seramik {
             /* JavaScript'teki üçlü operatörde "Mobilya" ve "Aydınlatma" DIŞINDAKİ her kategoriye (yani pratikte "Mutfak"a)
               bu class veriliyor; isim "seramik" olsa da fiilen Mutfak ürünleri için kullanılıyor */
            background: #d1fae5;
            /* Açık yeşil zemin */
            color: #065f46;
            /* Koyu yeşil yazı */
        }

        .btn-del {
            /* "Sil" butonunun normal (üzerine gelinmemiş) görünümü */
            background: transparent;
            /* Şeffaf arka plan, sadece kenarlık görünsün ("hayalet buton" tarzı) */
            border: 1px solid var(--border);
            /* İnce kenarlık */
            color: var(--muted);
            /* Soluk gri yazı */
            font-size: 11px;
            /* Küçük punto */
            padding: 4px 8px;
            /* İçine az boşluk */
            border-radius: 4px;
            /* Hafif yuvarlak köşeler */
            cursor: pointer;
            /* Tıklanabilir olduğunu belli eden imleç */
        }

        .btn-del:hover {
            /* Fare "Sil" butonunun üzerindeyken görünüm */
            background: #ef4444;
            /* Kırmızı arka plan - "dikkat, bu bir silme işlemi" uyarısı verir */
            color: #fff;
            /* Beyaz yazı */
            border-color: #ef4444;
            /* Kenarlığı da kırmızıya çevirir */
        }
    </style>
</head>

<body>
    <div class="kokpit">
        <!-- Sayfanın tüm görünür içeriğini saran ana kapsayıcı; CSS'teki
 .kokpit kuralı bunu ortalar ve genişliğini sınırlar -->
        <header class="header">
            <!-- Sayfanın en üstündeki başlık bölümü -->
            <span class="header__tag">Sipariş Takip</span>
             <!-- Küçük, büyük-harfli turuncu etiket yazısı -->
            <h1 class="header__title">Sipariş Yönetim Kokpiti</h1>
            <!-- Sayfanın büyük ana başlığı -->
        </header>

        <section class="kpi-grid">
            <!-- Ekranın üstünde yan yana duran 3 özet 
kutusunu (KPI = önemli performans göstergesi) saran bölüm -->
            <div class="kpi-card">
                <span>Kayıtlı sipariş</span>
                <!-- Kutunun küçük başlığı -->
                <h3 id="kpiCount">0</h3>
                <!-- "0" sadece başlangıç değeri; sayfa yüklenince 
JS bu id'yi bulup gerçek sipariş sayısıyla değiştirir -->
            </div>
            <div class="kpi-card">
                <span>Toplam Sipariş Tutar</span>
                <h3 id="kpiTotal">0 ₺</h3>
                <!-- JS tarafından toplam tutarla güncellenecek -->
            </div>
            <div class="kpi-card">
                <span>Ortalama Ürün Fiyatı</span>
                <h3 id="kpiAvg">0 ₺</h3>
                 <!-- JS tarafından ortalama fiyatla güncellenecek -->
            </div>
        </section>

        <main class="layout">
            <!-- Form (sol) ve liste (sağ) bölümlerini yan yana
         (dar ekranda alt alta) tutan ana içerik alanı -->
            <section class="panel">
                 <!-- Sol taraftaki "yeni sipariş ekle" formunu içeren kart -->
                <h4>Yeni sipariş kaydı</h4>
                <form id="orderForm">
                     <!-- id="orderForm": JS'in bu formu yakalayıp "submit" olayını dinleyebilmesi için gerekli -->
                    <div class="field">
                        <label for="prodName">Ürün Adı</label>
                         <!-- for="prodName": bu etikete tıklanınca aşağıdaki input'a odaklanılmasını sağlar (erişilebilirlik) -->
                        <input type="text" id="prodName" placeholder="Sehpa" required>
                         <!-- id="prodName": JS bu kutunun değerini okuyabilsin diye; required: kutu boşken form gönderilemez -->
                    </div>
                    <div class="field">
                        <label for="prodCat">Kategori</label>
                         <!-- Açılır liste; kullanıcı 3 kategoriden birini seçer -->
                        <select name="prodCat" id="prodCat">
                            <option value="Mobilya">Mobilya</option>
                            <option value="Aydınlatma">Aydınlatma</option>
                            <option value="Mutfak">Mutfak</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="prodPrice">Fiyat</label>
                        <input type="number" id="prodPrice" value="3250" min="100" step="50" required>
                         <!-- type="number": sadece rakam girilir; value="3250": ilk açıldığında görünen varsayılan değer;
                             min="100": 100'den küçük girilemez; step="50": ok tuşlarıyla artış/azalış 50'şer olur -->
                    </div>
                    <button type="submit" class="btn-submit">Siparişi Kaydet</button>
                    <!-- type="submit": bu butona basılınca (ya da Enter'a basılınca) formun "submit" olayı tetiklenir -->
                </form>
            </section>

            <section class="panel">
                 <!-- Sağ taraftaki filtre + sipariş listesi kartı -->
                <div class="filter-bar">
                    <input type="text" id="searchInput" class="field" style="margin-bottom: 0;"
                        placeholder="Ürün Adına Göre Filtrele">
                         <!-- Kullanıcı buraya yazdıkça JS "input" olayını yakalayıp listeyi filtreler -->
                    <select id="categoryFilter" style="width: 130px; font-size: 12px;padding: 6px;">
                        <option value="ALL">Tüm Kategoriler</option>
                        <option value="Mobilya">Mobilya</option>
                        <option value="Aydınlatma">Aydınlatma</option>
                        <option value="Mutfak">Mutfak</option>
                    </select>
                     <!-- "ALL" seçiliyken kategoriye göre hiç filtre uygulanmaz, tüm ürünler gösterilir -->
                </div>
                <div id="orderContainer" class="order-list">
                    <!-- Bu kutu başlangıçta BOŞ; JS, orders dizisindeki her ürün için buraya bir kart (article) ekleyecek -->
                    <!--Dinamik olarak elemanlar buraya basılacak /  eklenecek-->
                </div>
            </section>




        </main>




    </div>

    <script>
        let orders = [
            // Uygulamanın "veritabanı" gibi düşünülebilecek dizi; her eleman bir siparişi temsil eden bir nesne (object).
            // Sayfa ilk açıldığında ekranda görünen 5 ürün buradan geliyor.
            { id: 1, name: "Sehpa", category: "Mobilya", price: 6500 },
            { id: 2, name: "Abajür", category: "Aydınlatma", price: 7500 },
            { id: 3, name: "Koltuk", category: "Mobilya", price: 8500 },
            { id: 4, name: "Bulaşık Makinası", category: "Mutfak", price: 10000 },
            { id: 5, name: "Ocak", category: "Mutfak", price: 15000 }
        ];
        
        let nextId = orders.length + 1;
        // Yeni eklenecek her siparişe verilecek benzersiz kimlik sayacı; mevcut 5 ürün olduğu için 6'dan başlar

        //dom elementleri toplayalım
         
        const orderContainer = document.getElementById('orderContainer');
        // HTML'deki id="orderContainer" olan <div>'i JS değişkenine bağlar; ürün kartlarını buraya ekleyeceğiz
        const orderForm = document.getElementById('orderForm');
        // id="orderForm" olan <form>'u yakalar; "submit" olayını buna dinleteceğiz
        const searchInput = document.getElementById('searchInput');
        // Arama kutusunu yakalar; kullanıcı yazdıkça listeyi filtrelemek için kullanılır
        const categoryFilter = document.getElementById('categoryFilter');
        // Kategori açılır listesini yakalar; seçilen kategoriye göre filtreleme yapılır
        const kpiCount = document.getElementById('kpiCount');
         // "Kayıtlı sipariş" sayısının yazılacağı <h3> elemanı
        const kpiTotal = document.getElementById('kpiTotal');
        // "Toplam Sipariş Tutar" değerinin yazılacağı <h3> elemanı
        const kpiAvg = document.getElementById('kpiAvg');
        // "Ortalama Ürün Fiyatı" değerinin yazılacağı <h3> elemanı
        const prodName = document.getElementById('prodName');
          // Formdaki "Ürün Adı" kutusu; yeni sipariş eklerken buradaki değeri okuyacağız
        const prodCat = document.getElementById('prodCat'); // Formdaki kategori seçim kutusu
        const prodPrice = document.getElementById('prodPrice');
        // Formdaki fiyat kutusu

        const updateKPIs = (dataList) => {
            // Bu fonksiyon, parametre olarak aldığı listeye (dataList) bakıp yukarıdaki 3 KPI kutusunu günceller.
             // Parametre olarak liste almasının sebebi: bazen TÜM siparişlerin, bazen FİLTRELENMİŞ siparişlerin özetini göstermemiz gerekebilir.
            kpiCount.textContent = dataList.length;
              // .length dizideki eleman sayısını verir; bunu doğrudan ekrandaki sayı kutusuna yazar
            

            if (dataList.length === 0) {
                 // Liste boşsa (örneğin filtreye uyan ürün kalmadıysa) toplam/ortalama hesaplamaya gerek yok
                kpiTotal.textContent = "0 ₺";
                kpiAvg.textContent = "0 ₺";
                return;
                 // return, fonksiyonu burada erken bitirir; aşağıdaki satırlar hiç çalışmaz
            }

            //Toplam Tutar v(.reduce)
            const total = dataList.reduce((acc, curr) => acc + curr.price, 0);
            // .reduce dizideki tüm elemanları TEK bir değere indirger; acc (biriktirici) 0'dan başlar,
             // her ürün için acc'ye o ürünün price'ı eklenir, sonunda tüm fiyatların toplamı elde edilir
            kpiTotal.textContent = `${total.toLocaleString("tr-TR")} ₺`;
            kpiTotal.textContent = `${total.toLocaleString("tr-TR")} ₺`;
            // toLocaleString("tr-TR") sayıyı Türkçe formatına çevirir (binlik ayraç olarak nokta koyar, örn: 38500 -> "38.500")
 

            //Ortalama Fiyat (.reduce)
            const avg = total / dataList.length;
            // Ortalama = toplam tutar / ürün sayısı
            kpiAvg.textContent = `${Math.round(avg).toLocaleString("tr-TR")} ₺`;
            // Math.round ondalıklı sayıyı en yakın tam sayıya yuvarlar, sonra yine Türkçe formatla yazdırır

        }

        //Filtreleme bölümü (dinamik dom / Render Motoru)
        const renderOrders = () => {
            // Bu fonksiyon, "orders" dizisinin GÜNCEL halini alıp ekrandaki listeyi SIFIRDAN yeniden çizer.
            // Sipariş eklendiğinde, silindiğinde ya da arama/filtre değiştiğinde bu fonksiyon tekrar çağrılır.
            const term = searchInput.value.toLowerCase().trim();
            // Arama kutusundaki metni al, küçük harfe çevir (büyük/küçük harf farkı önemli olmasın) ve baş/son boşlukları temizle
            const selectedCat = categoryFilter.value;
            // Seçili kategoriyi al (örn: "Mobilya" ya da "ALL")



            //filtreleme bölümü
            const filtered=orders.filter(order=>{
                 // .filter dizideki her elemanı tek tek kontrol eder; içindeki fonksiyon true dönerse o eleman yeni diziye dahil edilir
                const matchesName=order.name.toLowerCase().includes(term);
                // Ürün adı, arama kutusundaki metni içeriyor mu? (örn: "seh" yazınca "Sehpa" eşleşir)
                const mathesCategory=selectedCat==="ALL" || order.category===selectedCat;
                   // Ya "Tüm Kategoriler" seçili, ya da ürünün kategorisi seçilenle birebir aynı olmalı
                return matchesName && mathesCategory;
                 // İkisi de doğruysa (&&) bu ürün filtrelenmiş listede kalır
            });

            orderContainer.innerHTML="";
            // Listeyi yeniden çizmeden önce kutuyu tamamen boşaltır; yoksa eski kartlar yenilerin üstüne eklenir, tekrar tekrar görünür
 

            if(filtered.length===0){
                // Arama/filtre sonucunda hiç ürün kalmadıysa
                orderContainer.innerHTML=`
                <div style="padding:24px; text-align:center; color:var(--muted);font-size:12px">
                    Kriterlere Uygun Ürün Bulunamadı
                    </div>
                `;
                 // Kullanıcıya "sonuç yok" mesajı gösterir
                updateKPIs([]);
                // Boş bir liste ile KPI'ları günceller (hepsi "0" olsun)
                return;
                 // Fonksiyondan çıkar, aşağıdaki kart oluşturma kodu hiç çalışmaz
            }

            //dinamik element üretim

            filtered.forEach(order=>{
                // .forEach filtrelenmiş listedeki HER ürün için aşağıdaki bloğu bir kez çalıştırır (döngü)
                const item=document.createElement("article");
                // Hafızada, henüz sayfaya eklenmemiş yeni bir <article> elemanı oluşturur
                item.className="order-item";
                // Bu elemana CSS'teki .order-item stilini uygulamak için class ekler
                item.setAttribute("data-id",order.id);
                // Elemanın üzerine "hangi siparişe ait olduğunu" saklamak için data-id özel özelliğini yazar; silme işleminde bunu geri okuyacağız

                const badgeClass=order.category==="Mobilya"?"badge--mobilya":order.category==="Aydınlatma" ?"badge--aydinlatma":"badge--seramik";
                 // Kategoriye göre hangi renk rozet class'ının kullanılacağını seçer
                 // (iç içe üçlü operatör: Mobilya->mor, Aydınlatma->sarı, ikisi de değilse yani Mutfak->yeşil/"seramik")
                item.innerHTML=`
                <div>
                    <h5>${order.name}</h5>
                    <p>Birim Fiyat: ${order.price.toLocaleString("tr-TR")} ₺</p>
                </div>
                <div class="meta-box">
                    <span class="badge ${badgeClass}">${order.category}</span>
                    <button class="btn-del" data-action="delete">Sil</button>
                </div>                
                
                `;
                  // Yukarıda oluşturduğumuz boş <article>'ın içini sipariş bilgileriyle dolduran HTML metnini yerleştirir
                 // (template literal - backtick `` içinde ${} ile değişken gömebiliyoruz)
                orderContainer.appendChild(item);
                // Hazırlanan kartı asıl sayfadaki orderContainer'ın içine EKLER; bu satıra kadar item sadece hafızadaydı, şimdi ekranda görünür

                updateKPIs(filtered);
                   // KPI'ları güncel filtrelenmiş listeye göre günceller


            })





        }
             orderForm.addEventListener("submit", (e) => {
                // Formda "Siparişi Kaydet" butonuna basılınca (ya da bir input'tayken Enter'a basılınca) bu fonksiyon otomatik çalışır
            e.preventDefault();
            // Tarayıcının formu gönderip sayfayı yenileme davranışını iptal eder; yoksa orders dizisi sıfırlanır, sayfa baştan yüklenir
 


            const newOrder = {
                id: nextId++,
                // Şu anki nextId değerini kullan, SONRA nextId'yi bir artır (++ değişkenden sonra geldiği için "önce kullan sonra artır" demek)
                name: prodName.value.trim(),// Ürün adı kutusundaki metni al, baş/son boşlukları temizle
                category: prodCat.value, // Seçili kategoriyi al
                price: Number(prodPrice.value)// Fiyat kutusundaki metni (string) gerçek bir sayıya çevirir; çevirmezsek ileride toplama işlemlerinde hata çıkar
            };

            orders.push(newOrder);// Yeni oluşturulan sipariş nesnesini orders dizisinin SONUNA ekle

            orderForm.reset();// Formdaki tüm kutuları temizler/varsayılana döndürür, kullanıcı yeni bir sipariş girmeye hazır olsun
            renderOrders();// Güncellenmiş orders dizisine göre listeyi ve KPI'ları yeniden çizer
        });

        orderContainer.addEventListener("click", (e) => {
            // orderContainer'ın İÇİNDEKİ herhangi bir yere tıklanınca bu fonksiyon çalışır (tek tek her "Sil" butonuna ayrı
            // dinleyici eklemek yerine, kartlar sonradan oluşturulduğu için üst elemanda dinliyoruz - "event delegation")
            if (e.target.dataset.action === "delete") {
                 // e.target gerçekte tıklanan elemandır; sadece "data-action=delete" olan (yani Sil butonu olan) tıklamalarla ilgileniyoruz
                const item = e.target.closest(".order-item");
                 // Tıklanan butondan başlayıp yukarı doğru en yakın .order-item class'lı atayı (kartın kendisini) bulur
                const id = Number(item.dataset.id);
                // O kartın üzerine yazılmış data-id değerini okur ve sayıya çevirir
                orders = orders.filter(order => order.id !== id);
                // orders dizisini yeniden oluşturur: id'si silinmek istenenle EŞİT OLMAYAN tüm siparişleri tutar,
                // yani o tek ürünü dışarıda bırakır

                renderOrders();
                // Güncel (bir eksik) orders dizisine göre listeyi yeniden çizer
            }
        });

        searchInput.addEventListener("input",renderOrders);
        // Arama kutusuna her harf yazıldığında (input olayı) renderOrders çalışır, liste anlık filtrelenir
        categoryFilter.addEventListener("change",renderOrders);
        // Kategori açılır listesinden bir seçenek değiştirildiğinde (change olayı) renderOrders çalışır

        renderOrders(); // Sayfa ilk açıldığında, henüz hiçbir kullanıcı etkileşimi olmadan, mevcut orders dizisini ekrana ilk kez çizmek için bir kez çağrılır

    </script>
